Global:
  model_name: PP-OCRv5_server_rec
PreProcess:
  transform_ops:
  - DecodeImage:
      channel_first: false
      img_mode: BGR
  - RecResizeImg:
      image_shape:
      - 3
      - 48
      - 320
      padding: true
  - NormalizeImage:
      mean:
      - 0.5
      - 0.5
      - 0.5
      scale: 1.0/255.0
      std:
      - 0.5
      - 0.5
      - 0.5
  - KeepKeys:
      keep_keys:
      - image
      - label
      - length
