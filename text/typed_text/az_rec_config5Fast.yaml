Global:
  use_gpu: true
  epoch_num: 400
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/
  save_epoch_step: 10
  eval_batch_step: [0, 1000]
  cal_metric_during_train: true
  pretrained_model: ./text/typed_text/az_config_train/pretrain_models/PP-OCRv5_server_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir: ./inference/
  use_visualdl: false
  character_dict_path: ./text/typed_text/az_config_train/dict.txt
  max_text_length: 25
  infer_mode: false
  use_space_char: true
  save_res_path: ./output/rec_predict.txt

Architecture:
  model_type: rec
  algorithm: SVTR
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 1
    pretrained: false
    use_conv: true
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            use_guide: true
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          transform:
            name: NRTREncoder
            hidden_dims: 120
            encoder_layer:
              - SelfAttention:
                  dims: 120
                  num_heads: 8
                  mlp_ratio: 1
                  drop_rate: 0.0
                  attn_drop_rate: 0.0
                  drop_path_rate: 0.0
                  qkv_bias: true
            num_layers: 2
          encoder:
            name: TransformerEncoder
            max_text_length: 25
            embedding_dim: 128
            num_heads: 8
            num_layers: 2
            feed_forward_dim: 512
            dropout: 0.0
            activation: relu
          decoder:
            name: TransformerDecoder
            max_text_length: 25
            embedding_dim: 128
            num_heads: 8
            num_layers: 2
            feed_forward_dim: 512
            dropout: 0.0
            activation: relu
    weight_list:
      ctc: 1.0
      nrtr: 0.0

Loss:
  name: CTCLoss

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 0.0005

PostProcess:
  name: CTCLabelDecode  # ИЗМЕНИЛОСЬ - используем CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/az_config_train
    label_file_list:
      - ./text/typed_text/az_config_train/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          image_shape: [48, 320, 3]
          max_text_length: 25
      - RecAug:
          prob: 0.5
      - CTCLabelEncode:  # ИЗМЕНИЛОСЬ - используем CTCLabelEncode
          character_dict_path: ./text/typed_text/az_config_train/dict.txt
          use_space_char: true
      - KeepKeys:
          keep_keys:
          - image
          - label
          - length
  loader:
    shuffle: true
    batch_size_per_card: 32  # УМЕНЬШИЛ для отладки
    drop_last: true
    num_workers: 8  # УМЕНЬШИЛ для отладки

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/az_config_train
    label_file_list:
      - ./text/typed_text/az_config_train/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:  # ИЗМЕНИЛОСЬ - используем CTCLabelEncode
          character_dict_path: ./text/typed_text/az_config_train/dict.txt
          use_space_char: true
      - KeepKeys:
          keep_keys:
          - image
          - label
          - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32  # УМЕНЬШИЛ для отладки
    num_workers: 8  # УМЕНЬШИЛ для отладки