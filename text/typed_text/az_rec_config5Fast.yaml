Global:
  use_gpu: true
  epoch_num: 200
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: ./output/test/
  save_epoch_step: 5
  eval_batch_step: [ 0, 500 ]
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  character_dict_path: ./text/typed_text/az_config_train/dict.txt
  max_text_length: 25
  use_space_char: false
  save_res_path: ./output/rec/predicts_azerbaijani.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 0.00001

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform: null
  Backbone:
    name: ResNet
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 128
  Head:
    name: CTCHead

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/az_config_train/
    label_file_list:
      - ./text/typed_text/az_config_train/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [ 3, 48, 320 ]
      - KeepKeys:
          keep_keys: [ 'image', 'label', 'length' ]
  loader:
    batch_size_per_card: 300
    shuffle: true
    drop_last: true
    num_workers: 16
    use_shared_memory: false  # Измени на false для избежания ошибок

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/az_config_train/
    label_file_list:
      - ./text/typed_text/az_config_train/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [ 3, 48, 320 ]
      - KeepKeys:
          keep_keys: [ 'image', 'label', 'length' ]
  loader:
    batch_size_per_card: 200
    shuffle: false
    drop_last: false
    num_workers: 8
    use_shared_memory: false