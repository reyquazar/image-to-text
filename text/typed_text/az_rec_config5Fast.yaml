Global:
  use_gpu: true
  epoch_num: 5                    # Всего 5 эпох для быстрой проверки
  log_smooth_window: 5
  print_batch_step: 10
  save_model_dir: ./output/
  save_epoch_step: 1
  eval_batch_step: [0, 100]
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  character_dict_path: ppocr/utils/dict/azerbaijani_dict.txt
  max_text_length: 25
  use_space_char: false

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 1

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform: null
  Backbone:
    name: ResNet34
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 128              # Уменьшено для скорости
  Head:
    name: CTCHead

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/az_config_train/
    label_file_list:
      - ./text/typed_text/az_config_train/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
    loader:
      batch_size_per_card: 32     # Меньше batch size
      shuffle: true
      drop_last: true
      num_workers: 4
      use_shared_memory: true

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/az_config_train/
    label_file_list:
      - ./text/typed_text/az_config_train/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
    loader:
      batch_size_per_card: 32
      shuffle: false
      drop_last: false
      num_workers: 2