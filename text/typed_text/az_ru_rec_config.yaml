Global:
  model_name: PP-OCRv5_server_rec
  use_gpu: true
  epoch_num: 300
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/
  save_inference_dir: ./output_inference/
  save_epoch_step: 10
  eval_batch_step: [100, 200]
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints:
  character_dict_path: ./text/azerbaijani_dict.txt
  max_text_length: 15
  use_space_char: false
  infer_mode: false
  save_res_path: ./output/aze_predicts.txt
  use_visualdl: true

Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.001
    schedulers:
      - name: CosineAnnealingLR
        T_max: 300
        eta_min: 0.00001
  regularizer:
    name: L2
    factor: 0.00001

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform:
  Backbone:
    name: ResNet
    layers: 34
    pretrained: false
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 512  # Увеличил для сложных символов
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/azerbaijani/
    label_file_list:
      - ./text/azerbaijani/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 400]  # Увеличил размер для лучшего качества
          padding: true
      - ColorJitter:
          brightness: 0.4
          contrast: 0.4
          saturation: 0.4
      - RandAugment:
          num_layers: 2
          magnitude: 8
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 8
    use_shared_memory: true

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/azerbaijani/
    label_file_list:
      - ./text/azerbaijani/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 400]
          padding: true
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 8
    use_shared_memory: true