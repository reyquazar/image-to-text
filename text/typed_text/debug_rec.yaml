Global:
  model_name: PP-OCRv5_server_rec
  debug: false
  use_gpu: true
  epoch_num: 5
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: ./output/rec/rec_ppocrv5/
  save_epoch_step: 10
  eval_batch_step: [ 0, 200 ]
  cal_metric_during_train: false
  calc_epoch_interval: 1
  pretrained_model: ./text/typed_text/pretrain_models/PP-OCRv5_server_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  character_dict_path: ./text/typed_text/az_config_train/dict.txt
  max_text_length: 25
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/rec/predicts_ppocrv5.txt
  infer_img:

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_HGNet
  Transform:
  Backbone:
    name: PPHGNetV2_B4
    text_rec: True
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [ 1, 3 ]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 25

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: LMDBDataSet
    data_dir: ./text/typed_text/az_config_train/train_lmdb/
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [ 3, 48, 320 ]
      - KeepKeys:
          keep_keys: [ 'image', 'label_ctc', 'label_gtc', 'length', 'valid_ratio' ]
  loader:
    shuffle: true
    batch_size_per_card: 512
    drop_last: true
    num_workers: 8
    use_shared_memory: false

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: ./text/typed_text/az_config_train/val_lmdb/
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [ 3, 48, 320 ]
      - KeepKeys:
          keep_keys: [ 'image', 'label_ctc', 'label_gtc', 'length', 'valid_ratio' ]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 4
    use_shared_memory: false