Global:
  use_gpu: true
  epoch_num: 20
  log_smooth_window: 5
  print_batch_step: 2
  save_model_dir: ./output_simple/
  save_epoch_step: 10
  eval_batch_step: [0, 10]
  cal_metric_during_train: true
  pretrained_model:  # ← ПУСТО! Обучай с нуля
  character_dict_path: ./text/typed_text/pure_azerbaijani_cyrillic_dataset3/dict.txt
  max_text_length: 25
  use_space_char: false

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.001  # Простой LR

Architecture:
  model_type: rec
  algorithm: CRNN
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 48
  Head:
    name: CTCHead

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/pure_azerbaijani_cyrillic_dataset3
    label_file_list:
      - ./text/typed_text/pure_azerbaijani_cyrillic_dataset3/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: true
    batch_size_per_card: 4
    drop_last: false
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/pure_azerbaijani_cyrillic_dataset3
    label_file_list:
      - ./text/typed_text/pure_azerbaijani_cyrillic_dataset3/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 4
    num_workers: 1