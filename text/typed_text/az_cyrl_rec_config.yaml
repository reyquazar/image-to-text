Global:
  use_gpu: true
  epoch_num: 50  # Уменьшил для теста
  log_smooth_window: 5
  print_batch_step: 2  # Вывод каждые 2 батча
  save_model_dir: ./output_test/
  save_epoch_step: 10
  eval_batch_step: [0, 10]  # Чаще валидация
  cal_metric_during_train: true
  pretrained_model: ./text/typed_text/pretrain_models/PP-OCRv5_server_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: ./text/typed_text/pure_azerbaijani_cyrillic_dataset3/dict.txt
  max_text_length: 40
  infer_mode: false
  use_space_char: false  # Поставь false если нет пробелов
  save_res_path: ./output_test/predicts_rec.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.001  # Увеличил LR для быстрого обучения
  regularizer:
    name: L2
    factor: 0.00001

Architecture:
  model_type: rec
  algorithm: CRNN  # Вернул старую работающую архитектуру!
  Transform:
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 48
  Head:
    name: CTCHead

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/pure_azerbaijani_cyrillic_dataset3
    label_file_list:
      - ./text/typed_text/pure_azerbaijani_cyrillic_dataset3/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: true
    batch_size_per_card: 4  # 20 картинок / 4 = 5 батчей за эпоху
    drop_last: false  # Важно: false чтобы использовать все данные
    num_workers: 2
    use_shared_memory: false

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/pure_azerbaijani_cyrillic_dataset3
    label_file_list:
      - ./text/typed_text/pure_azerbaijani_cyrillic_dataset3/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 4
    num_workers: 1
    use_shared_memory: false