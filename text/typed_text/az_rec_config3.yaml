Architecture:
  Backbone:
    name: PPHGNetV2_B4
    text_rec: true
  Head:
    head_list:
    - CTCHead:
        Head:
          fc_decay: 1.0e-05
        Neck:
          depth: 2
          dims: 120
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          name: svtr
          use_guide: true
    - NRTRHead:
        max_text_length: 25
        nrtr_dim: 384
    name: MultiHead
  Transform: null
  algorithm: SVTR_HGNet
  model_type: rec
Eval:
  dataset:
    data_dir: ./text/typed_text/az_config_train
    label_file_list:
    - ./text/typed_text/az_config_train/val_list.txt
    name: SimpleDataSet
    transforms:
    - DecodeImage:
        channel_first: false
        img_mode: BGR
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    batch_size_per_card: 300
    drop_last: false
    num_workers: 16
    shuffle: false
Global:
  cal_metric_during_train: true
  character_dict_path: ./text/typed_text/az_config_train/dict.txt
  checkpoints: null
  epoch_num: 500
  eval_batch_step:
  - 0
  - 250
  infer_mode: false
  log_smooth_window: 20
  max_text_length: 25
  model_name: PP-OCRv5_server_rec
  pretrained_model: ./text/typed_text/pretrain_models/PP-OCRv5_server_rec_pretrained.pdparams
  print_batch_step: 10
  save_epoch_step: 20
  save_model_dir: ./output/
  save_res_path: ./output/aze_predicts.txt
  use_gpu: true
  use_space_char: false
  use_visualdl: true
Loss:
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
  name: MultiLoss
Metric:
  main_indicator: acc
  name: RecMetric
Optimizer:
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.0005
    name: Cosine
    warmup_epoch: 1
  name: Adam
  regularizer:
    factor: 3.0e-05
    name: L2
PostProcess:
  name: CTCLabelDecode
Train:
  dataset:
    data_dir: ./text/typed_text/az_config_train
    ds_width: false
    ext_op_transform_idx: 1
    label_file_list:
    - ./text/typed_text/az_config_train/train_list.txt
    name: MultiScaleDataSet
    transforms:
    - DecodeImage:
        channel_first: false
        img_mode: BGR
    - RecAug: null
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    batch_size_per_card: 128
    drop_last: true
    num_workers: 16
    shuffle: true
  sampler:
    divided_factor:
    - 8
    - 16
    first_bs: 128
    fix_bs: false
    is_training: true
    name: MultiScaleSampler
    scales:
    - - 320
      - 32
    - - 320
      - 48
    - - 320
      - 64
