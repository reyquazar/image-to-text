Global:
  model: PP-OCRv5_server_rec
  mode: check_dataset # check_dataset/train/evaluate/predict
  dataset_dir: "./text/typed_text/az_config_train"
  device: gpu:0
  output: "output"

CheckDataset:
  convert:
    enable: False
    src_dataset_type: null
  split:
    enable: False
    train_percent: null
    val_percent: null

Train:
  epochs_iters: 20
  batch_size: 8
  learning_rate: 0.001
  pretrain_weight_path: ./text/typed_text/pretrain_models/PP-OCRv5_server_rec_pretrained.pdparams
  resume_path: null
  log_interval: 20
  eval_interval: 1
  save_interval: 1

Evaluate:
  weight_path: "output/best_accuracy/best_accuracy.pdparams"
  log_interval: 1

Export:
  weight_path: ./text/typed_text/pretrain_models/PP-OCRv5_server_rec_pretrained.pdparams

Predict:
  batch_size: 1
  model_dir: "output/best_accuracy/inference"
  input: "./text/typed_text/az_config_train/test_0000006.jpg"
  kernel_option:
    run_mode: paddle