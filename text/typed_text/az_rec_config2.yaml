Global:
  model_name: PP-OCRv5_server_rec
  use_gpu: true
  epoch_num: 500  # Оставил твоё, но можно уменьшить до 100-200
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/
  save_epoch_step: 20
  eval_batch_step: [0, 250]
  cal_metric_during_train: true
  pretrained_model: ./text/typed_text/pretrain_models/PP-OCRv5_server_rec_pretrained.pdparams
  checkpoints:
  character_dict_path: ./text/typed_text/az_config_train/dict.txt
  max_text_length: 25  # УВЕЛИЧИЛ с 15!
  use_space_char: false
  infer_mode: false
  save_res_path: ./output/aze_predicts.txt
  use_visualdl: true

Optimizer:
  name: Adam  # СМЕНИЛ с AdamW
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine  # СМЕНИЛ планировщик
    learning_rate: 0.0005
    warmup_epoch: 1  # ДОБАВИЛ warmup
  regularizer:
    name: L2
    factor: 0.00003  # ИЗМЕНИЛ коэффициент

Architecture:
  model_type: rec
  algorithm: SVTR_HGNet  # СМЕНИЛ алгоритм!
  Transform:
  Backbone:
    name: PPHGNetV2_B4  # СМЕНИЛ архитектуру!
    text_rec: True
  Head:
    name: MultiHead  # СМЕНИЛ на MultiHead!
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 25

Loss:
  name: MultiLoss  # СМЕНИЛ loss!
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet  # СМЕНИЛ датасет!
    ds_width: false
    data_dir: ./text/typed_text/az_config_train
    ext_op_transform_idx: 1
    label_file_list:
      - ./text/typed_text/az_config_train/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:  # ДОБАВИЛ аугментацию!
      - MultiLabelEncode:  # СМЕНИЛ кодирование!
          gtc_encode: NRTRLabelEncode
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  sampler:
    name: MultiScaleSampler  # ДОБАВИЛ мультискейл семплер!
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: 128
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: 128  # УМЕНЬШИЛ с 256!
    drop_last: true
    num_workers: 16

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/typed_text/az_config_train
    label_file_list:
      - ./text/typed_text/az_config_train/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:  # СМЕНИЛ кодирование!
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 300
    num_workers: 16