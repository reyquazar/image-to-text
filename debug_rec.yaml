Global:
  model_name: PP-OCRv5_server_rec
  use_gpu: true
  epoch_num: 500
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/
  save_inference_dir: ./output_inference_crnn/
  save_epoch_step: 5
  eval_batch_step: [20, 50]
  cal_metric_during_train: true
  pretrained_model: null  # ОБУЧЕНИЕ С НУЛЯ
  checkpoints:
  character_dict_path: ./text/debug/dict.txt
  max_text_length: 10
  use_space_char: false
  infer_mode: false
  save_res_path: ./output/debug_predicts.txt
  use_visualdl: true

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.001
  regularizer:
    name: L2
    factor: 0.00001

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform:
  Backbone:
    name: ResNet
    layers: 34
    pretrained: false  # С НУЛЯ
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 256
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/debug
    label_file_list:
      - ./text/debug/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: true
    num_workers: 4
    use_shared_memory: true

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/debug
    label_file_list:
      - ./text/debug/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 16
    num_workers: 4
    use_shared_memory: true