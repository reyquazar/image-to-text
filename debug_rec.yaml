Global:
  use_gpu: true
  epoch_num: 3
  log_smooth_window: 1
  print_batch_step: 1
  save_model_dir: ./output/debug_model
  save_epoch_step: 1
  eval_batch_step: [0, 1]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  character_dict_path: ./text/debug/dict.txt
  max_text_length: 10
  use_space_char: false
  infer_mode: false
  save_res_path: ./output/debug_predicts.txt

Optimizer:
  name: Adam
  lr:
    learning_rate: 0.001

Architecture:
  model_type: rec
  algorithm: CRNN
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [2, 2]
    last_pool_type: avg
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/debug
    label_file_list:
      - ./text/debug/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys: [ 'image', 'label', 'length' ]
  loader:
    shuffle: true
    batch_size_per_card: 2
    drop_last: false
    num_workers: 0
    use_shared_memory: false

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./text/debug
    label_file_list:
      - ./text/debug/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys: [ 'image', 'label', 'length' ]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 2
    num_workers: 0
    use_shared_memory: false
