<!-- popup.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tesseract OCR</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h2>OCR</h2>

    <div class="controls">
      <input id="fileInput" type="file" accept="image/*" />
      <button id="captureBtn">Скриншот вкладки</button>
      <button id="captureAreaBtn">Выделение области</button>
      <button id="runBtn">Запустить OCR</button>
    </div>

    <div id="previewWrap">
      <canvas id="preview" width="640" height="360"></canvas>
    </div>

    <div id="status">Статус: ожидание</div>

    <pre id="result" class="result"></pre>
  </div>

  <script src="popup.js"></script>
</body>
</html>
